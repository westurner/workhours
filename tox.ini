[tox]
envlist =
    py314
#,cover
#    py26,py27,py32,pypy,cover

[testenv:py27]
basepython =
    python2.7
commands = 
    easy_install pyutmp
    nosetests
deps =
    zope.component
    Sphinx
    repoze.sphinx.autointerface
    WebTest
    virtualenv
    venusian
    nose

[testenv:py32]
commands = 
    easy_install pyutmp
    nosetests
deps =
    WebTest
    virtualenv
    venusian
    nose


[testenv:py314]
basepython =
    python3.14
extras =
    app
    sqlite
    test
    docs
deps =
    cython
    {toxinidir}/src/pyutmp
    zope.component
    Sphinx
    repoze.sphinx.autointerface
    WebTest
    virtualenv
    venusian
    pytest
    pytest-cov
commands =
    pip install --no-build-isolation -e src/pyutmp
    pytest {posargs}

[testenv:cover]
basepython =
    python3.14
extras =
    app
    sqlite
    test
    docs
deps =
    cython
    {toxinidir}/src/pyutmp
    zope.component
    Sphinx
    WebTest
    repoze.sphinx.autointerface
    virtualenv
    venusian
    pytest
    pytest-cov
    coverage
commands =
    pip install --no-build-isolation -e src/pyutmp
    pytest --junitxml=pytest.xml --cov=workhours --cov-report=term-missing --cov-report=xml {posargs}

# we separate coverage into its own testenv because a) "last run wins" wrt
# cobertura jenkins reporting and b) pypy and jython can't handle any
# combination of versions of coverage and nosexcover that i can find.

