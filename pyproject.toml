[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workhours"
version = "0.5.01"
description = "Aggregates events from various sources"
dynamic = ["readme"]
license = "BSD-3-Clause"
authors = [
    {name = "Wes Turner", email = "wes@wrd.nu"},
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pyramid",
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema",
]

[project.optional-dependencies]
app = [
    "alembic",
    "beautifulsoup4",
    "celery",
    "colander",
    "deform",
    "deform-jinja2",
    "fixture",
    "formencode",
    "html2text",
    "iso8601",
    "passlib",
    "peppercorn",
    "pyes",
    "pyparsing",
    "pyramid",
    "pyramid-celery",
    "pyramid-debugtoolbar",
    "pyramid-deform",
    "pyramid-jinja2",
    "pyramid-marrowmailer",
    "pyramid-restler",
    "pyramid-simpleform",
    "pyramid-sqlalchemy",
    "pyramid-tm",
    "pytz",
    "pyutmp",
    "jsonschema",
    "sqlalchemy",
    "sqlalchemy-utils",
    "standard-imghdr",
    "waitress",
    "webhelpers",
]
sqlite = [
    "beautifulsoup4",
    "pyutmp",
    "pytz",
    "sqlalchemy",
    "sqlalchemy-utils",
    "sqlite-utils>=3.37",
]
test = [
    "WebTest",
    "coverage",
    "fixture",
    "pyramid-debugtoolbar",
    "pytest",
    "pytest-cov",
    "venusian",
    "virtualenv",
    "zope.component",
]
docs = [
    "Sphinx",
    "repoze.sphinx.autointerface",
]

[project.scripts]
workhours = "workhours.climain:main"

[project.entry-points."paste.app_factory"]
main = "workhours:main"

[project.entry-points.sqlite_utils]
workhours = "workhours_parser.sqlite_utils_plugin"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
where = ["."]
include = ["workhours*", "workhours_parser*"]
exclude = ["ez_setup*", "examples*", "tests*", "src*"]

[tool.setuptools.package-data]
workhours = [
    "README.rst",
    "CHANGES.rst",
    "scripts/*.sh",
]
workhours_parser = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["workhours", "workhours_parser"]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:imghdr was removed in Python 3.13:DeprecationWarning",
]
